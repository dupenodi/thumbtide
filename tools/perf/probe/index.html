<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thumbtide probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0b12;
        color: #e8e6f0;
        font: 22px/1.4 monospace;
        overflow: hidden;
      }
      #out {
        margin: 40px 60px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #scratch {
        position: absolute;
        left: 0;
        top: 0;
        width: 400px;
        height: 80px;
        overflow: hidden;
        opacity: 0;
      }
      .chip {
        position: absolute;
        padding: 2px 6px;
        border-radius: 6px;
        background: #333;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="scratch"></div>
    <pre id="out"></pre>
    <script src="probe.js"></script>
  </body>
</html>
